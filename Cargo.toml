[package]
name = "payments-engine"
version = "0.1.0"
edition = "2021"
authors = ["Mitja Kramberger <mitja.kramberger@example.com>"]
description = "A streaming transaction processing engine"

[[bin]]
name = "payments-engine"
path = "src/main.rs"

[lib]
name = "payments_engine"
path = "src/lib.rs"

[dependencies]
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
rust_decimal = "1.33"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.17"

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
debug = true
